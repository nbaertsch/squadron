name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format check
        run: uv run ruff format --check src/ tests/

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Unit tests
        run: uv run pytest tests/ --ignore=tests/e2e/ -v --tb=short

  # ─── E2E tests — full sandbox chain ────────────────────────────────
  # Validates the complete sandbox MitM proxy infrastructure:
  #   CA → veth bridge → network namespace → iptables DNAT → MitM proxy
  #   → credential injection → real API forwarding
  #
  # Tests run as root with network namespace support (mirroring
  # production container deployment).
  #
  # Includes:
  #   - Proxy E2E: direct TLS → proxy → real Copilot API
  #   - Namespace E2E: infrastructure + TLS + credential injection + env scrub
  #   - Lifecycle E2E: SDK session lifecycle through full proxy chain
  #   - SDK-in-namespace: real SDK completion through DNAT → proxy → API
  #
  # Requires these GitHub Actions secrets:
  #   SQ_COPILOT_TOKEN           — GitHub PAT with Copilot access
  #
  # And these repository variables (Settings → Secrets and variables → Variables):
  #   E2E_ENABLED                — Set to 'true' to enable this job
  e2e:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: vars.E2E_ENABLED == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Install network namespace tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iproute2 iptables

      - name: Fix Copilot CLI permissions
        run: chmod +x .venv/lib/python*/site-packages/copilot/bin/copilot

      - name: E2E tests (full sandbox chain)
        run: |
          sudo $(which uv) run pytest tests/e2e/ -v --tb=short
        timeout-minutes: 15
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.SQ_COPILOT_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
