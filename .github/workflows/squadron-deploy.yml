# Squadron Deploy — Azure Container Instances
#
# This workflow manages the full lifecycle of a Squadron deployment:
#   - Full deploy: infrastructure + new container image (code changes or manual)
#   - Config sync: upload .squadron/ config + restart (config-only changes)
#   - Destroy: tear down all infrastructure
#
# On push to main:
#   - Code changes (src/**, Dockerfile, pyproject.toml) → wait for CI to push
#     the Docker image, then full deploy using the SHA-tagged image
#   - Config-only changes (.squadron/**) → sync-config (restart container)
#
# Manual dispatch: Actions → Squadron Deploy → Run workflow
#
# ACI vs Container Apps:
#   ACI supports Linux capabilities (CAP_NET_ADMIN, CAP_SYS_ADMIN) required
#   for the sandbox MitM proxy / network namespace isolation. Container Apps
#   does not grant capabilities. Trade-off: no managed HTTPS ingress — the
#   container exposes HTTP on port 8000 with a public IP + DNS label.

name: Squadron Deploy

on:
  # ── Manual trigger ─────────────────────────────────────────────────
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - deploy
          - sync-config
          - destroy
        default: deploy
      resource-group:
        description: "Azure resource group"
        required: false
        default: "squadron-rg"
      location:
        description: "Azure region"
        required: false
        default: "eastus2"
      app-name:
        description: "Container Instance name (default: <repo>-squadron)"
        required: false
      squadron-image:
        description: "Squadron container image"
        required: false
        default: "ghcr.io/nbaertsch/squadron:latest"

  # ── Auto-deploy on code/config changes ────────────────────────────
  push:
    branches: [main]
    paths:
      - ".squadron/**"
      - "src/**"
      - "infra/**"
      - "Dockerfile"
      - "pyproject.toml"

# ── Permissions ────────────────────────────────────────────────────────────
permissions:
  contents: read
  packages: read

# ── Environment ────────────────────────────────────────────────────────────
env:
  SQUADRON_REF: "main"

jobs:
  # ════════════════════════════════════════════════════════════════════
  # Detect what changed (push events only)
  # ════════════════════════════════════════════════════════════════════
  detect:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.check.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for code vs config changes
        id: check
        run: |
          if git diff --name-only HEAD~1 | grep -qE '^(src/|infra/|Dockerfile|pyproject\.toml)'; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            echo "Code changes detected — will trigger full deploy"
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
            echo "Config-only changes — will trigger sync-config"
          fi

  # ════════════════════════════════════════════════════════════════════
  # Wait for CI to push the Docker image (push events with code changes)
  # ════════════════════════════════════════════════════════════════════
  wait-for-image:
    needs: [detect]
    if: github.event_name == 'push' && needs.detect.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - name: Wait for SHA-tagged image in GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="sha-${SHORT_SHA}"
          IMAGE="ghcr.io/${{ github.repository }}:${TAG}"
          echo "Waiting for ${IMAGE} to be available..."

          for i in $(seq 1 60); do
            # Check if the tag exists via GHCR API
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $(echo ${{ github.token }} | base64 -w0)" \
              "https://ghcr.io/v2/${{ github.repository }}/manifests/${TAG}" \
              -H "Accept: application/vnd.oci.image.index.v1+json" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ]; then
              echo "Image ${IMAGE} is available (HTTP ${HTTP_CODE})"
              break
            fi
            # Also try gh api as fallback
            FOUND=$(gh api "/users/${{ github.repository_owner }}/packages/container/$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')/versions" \
              --jq "[.[] | select(.metadata.container.tags[] == \"${TAG}\")] | length" 2>/dev/null || echo "0")
            if [ "$FOUND" != "0" ]; then
              echo "Image ${IMAGE} found via API"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "::error::Timed out waiting for ${IMAGE} after 5 minutes"
              exit 1
            fi
            echo "  Attempt $i/60 — not found yet (waiting 5s...)"
            sleep 5
          done

      - name: Resolve image tag
        id: resolve
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image=ghcr.io/${{ github.repository }}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

  # ════════════════════════════════════════════════════════════════════
  # Deploy infrastructure + sync config (full redeploy)
  # ════════════════════════════════════════════════════════════════════
  deploy:
    needs: [detect, wait-for-image]
    if: >
      always() && (
        (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy')
        || (needs.detect.outputs.code_changed == 'true' && needs.wait-for-image.result == 'success')
      )
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate .squadron/ exists
        run: |
          if [ ! -d ".squadron" ]; then
            echo "::error::.squadron/ directory not found."
            echo "Run 'squadron init' to create it, then commit and push."
            exit 1
          fi
          if [ ! -f ".squadron/config.yaml" ]; then
            echo "::error::.squadron/config.yaml not found."
            exit 1
          fi
          echo "Found .squadron/ with config.yaml"
          ls -la .squadron/

      - name: Determine app name
        id: app
        run: |
          if [ -n "${{ inputs.app-name }}" ]; then
            echo "name=${{ inputs.app-name }}" >> "$GITHUB_OUTPUT"
          else
            REPO_NAME="${{ github.event.repository.name }}"
            echo "name=${REPO_NAME}-squadron" >> "$GITHUB_OUTPUT"
          fi

      - name: Set deployment parameters
        id: params
        run: |
          echo "resource-group=${{ inputs.resource-group || 'squadron-rg' }}" >> "$GITHUB_OUTPUT"
          echo "location=${{ inputs.location || 'eastus2' }}" >> "$GITHUB_OUTPUT"
          # For push events, use the SHA-tagged image from wait-for-image job.
          # For manual dispatch, use the user-provided image (defaults to :latest).
          if [ -n "${{ needs.wait-for-image.outputs.image }}" ]; then
            echo "image=${{ needs.wait-for-image.outputs.image }}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${{ inputs.squadron-image || 'ghcr.io/nbaertsch/squadron:latest' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Register required Azure providers
        run: |
          set -euo pipefail
          for ns in Microsoft.OperationalInsights Microsoft.ContainerInstance Microsoft.Storage; do
            state=$(az provider show --namespace "$ns" --query registrationState -o tsv 2>/dev/null || echo "NotRegistered")
            if [ "$state" != "Registered" ]; then
              echo "Registering $ns (currently: $state)..."
              az provider register --namespace "$ns" --wait
              echo "$ns registered"
            else
              echo "$ns already registered"
            fi
          done

      - name: Azure context diagnostics
        run: |
          set -euo pipefail
          echo "## Azure context" 
          az account show -o jsonc
          echo "" 
          echo "## Provider registration states" 
          for ns in Microsoft.OperationalInsights Microsoft.ContainerInstance Microsoft.Storage; do
            state=$(az provider show --namespace "$ns" --query registrationState -o tsv 2>/dev/null || echo "unknown")
            echo "- $ns: $state"
          done

      # ── Infrastructure ────────────────────────────────────────────
      - name: Download Squadron Bicep template (ACI)
        run: |
          curl -sfL \
            "https://raw.githubusercontent.com/nbaertsch/squadron/${{ env.SQUADRON_REF }}/infra/main-aci.bicep" \
            -o /tmp/squadron-infra.bicep
          echo "Downloaded ACI Bicep template (ref: ${{ env.SQUADRON_REF }})"

      - name: Create resource group
        run: |
          az group create \
            --name "${{ steps.params.outputs.resource-group }}" \
            --location "${{ steps.params.outputs.location }}" \
            --output none
          echo "Resource group ready: ${{ steps.params.outputs.resource-group }}"

      - name: Deploy infrastructure (Bicep → ACI)
        env:
          APP_NAME: ${{ steps.app.outputs.name }}
          IMAGE: ${{ steps.params.outputs.image }}
          LOCATION: ${{ steps.params.outputs.location }}
          SQ_APP_ID: ${{ secrets.SQ_APP_ID_DEV }}
          SQ_PRIVATE_KEY: ${{ secrets.SQ_APP_PRIVATE_KEY }}
          SQ_INSTALLATION_ID: ${{ secrets.SQ_INSTALLATION_ID_DEV }}
          SQ_WEBHOOK_SECRET: ${{ secrets.SQ_WEBHOOK_SECRET }}
          SQ_COPILOT_TOKEN: ${{ secrets.SQ_COPILOT_TOKEN }}
          SQ_DASHBOARD_API_KEY: ${{ secrets.SQUADRON_DASHBOARD_API_KEY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PASSWORD: ${{ secrets.GHCR_PASSWORD }}
          REPO_URL: https://github.com/${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail

          # Write ARM parameters file using JSON escaping (handles multiline PEM keys)
          python3 - <<'PY' > /tmp/squadron-params.json
          import json, os

          def must_get(name: str) -> str:
              v = os.environ.get(name, "")
              if not v:
                  raise SystemExit(f"Missing required secret env var: {name}")
              return v

          doc = {
              "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
              "contentVersion": "1.0.0.0",
              "parameters": {
                  "appName": {"value": os.environ["APP_NAME"]},
                  "ghcrImage": {"value": os.environ["IMAGE"]},
                  "location": {"value": os.environ["LOCATION"]},
                  "githubAppId": {"value": must_get("SQ_APP_ID")},
                  "githubPrivateKey": {"value": must_get("SQ_PRIVATE_KEY")},
                  "githubInstallationId": {"value": must_get("SQ_INSTALLATION_ID")},
                  "githubWebhookSecret": {"value": must_get("SQ_WEBHOOK_SECRET")},
                  # Repo clone config
                  "repoUrl": {"value": os.environ.get("REPO_URL", "")},
                  "defaultBranch": {"value": os.environ.get("DEFAULT_BRANCH", "main")},
                  # Optional
                  "copilotGithubToken": {"value": os.environ.get("SQ_COPILOT_TOKEN", "")},
                  "dashboardApiKey": {"value": os.environ.get("SQ_DASHBOARD_API_KEY", "")},
                  # GHCR image pull credentials
                  "ghcrUsername": {"value": os.environ.get("GHCR_USERNAME", "")},
                  "ghcrPassword": {"value": os.environ.get("GHCR_PASSWORD", "")},
              },
          }
          print(json.dumps(doc, indent=2))
          PY

          az deployment group create \
            --name "squadron-infra" \
            --resource-group "${{ steps.params.outputs.resource-group }}" \
            --template-file /tmp/squadron-infra.bicep \
            --parameters @/tmp/squadron-params.json \
            --output none

      # ── Clean up stale DB from Azure Files (legacy) ───────────────
      - name: Remove stale registry DB from Azure Files
        run: |
          az storage file delete-batch \
            --source "squadron-data" \
            --pattern ".squadron-data/*" \
            --account-name "${{ steps.storage.outputs.account }}" \
            --account-key "${{ steps.storage.outputs.key }}" \
            --output none 2>/dev/null || true
          echo "Cleaned up any stale registry DB from Azure Files"

      # ── Config sync (always runs) ─────────────────────────────────
      - name: Resolve storage account
        id: storage
        run: |
          # Find the storage account in the resource group
          STORAGE_ACCOUNT=$(az storage account list \
            --resource-group "${{ steps.params.outputs.resource-group }}" \
            --query "[0].name" --output tsv)

          if [ -z "$STORAGE_ACCOUNT" ]; then
            echo "::error::No storage account found in resource group."
            echo "Run with action=deploy first to create infrastructure."
            exit 1
          fi

          STORAGE_KEY=$(az storage account keys list \
            --account-name "$STORAGE_ACCOUNT" \
            --query "[0].value" --output tsv)

          echo "account=$STORAGE_ACCOUNT" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$STORAGE_KEY"
          echo "key=$STORAGE_KEY" >> "$GITHUB_OUTPUT"
          echo "Resolved storage account: $STORAGE_ACCOUNT"

      - name: Sync .squadron/ config to Azure Files
        run: |
          echo "Removing existing .squadron/ from Azure Files share (best-effort)..."
          az storage file delete-batch \
            --source "squadron-data" \
            --pattern ".squadron/*" \
            --account-name "${{ steps.storage.outputs.account }}" \
            --account-key "${{ steps.storage.outputs.key }}" \
            --output none \
            2>/dev/null || true

          echo "Uploading .squadron/ to Azure Files share..."
          az storage file upload-batch \
            --destination "squadron-data" \
            --source ".squadron" \
            --destination-path ".squadron" \
            --account-name "${{ steps.storage.outputs.account }}" \
            --account-key "${{ steps.storage.outputs.key }}"
          echo "Config synced successfully"

      - name: Restart container to load new config
        run: |
          echo "Restarting container instance to pick up config changes..."
          az container restart \
            --name "${{ steps.app.outputs.name }}" \
            --resource-group "${{ steps.params.outputs.resource-group }}" \
            --output none
          echo "Container instance restarted"

      # ── Output ────────────────────────────────────────────────────
      - name: Output deployment info
        run: |
          FQDN=$(az container show \
            --name "${{ steps.app.outputs.name }}" \
            --resource-group "${{ steps.params.outputs.resource-group }}" \
            --query "ipAddress.fqdn" --output tsv 2>/dev/null || true)

          IP=$(az container show \
            --name "${{ steps.app.outputs.name }}" \
            --resource-group "${{ steps.params.outputs.resource-group }}" \
            --query "ipAddress.ip" --output tsv 2>/dev/null || true)

          if [ -n "$FQDN" ]; then
            echo "## Squadron Deployed (ACI)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| | |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| **App** | \`${{ steps.app.outputs.name }}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **FQDN** | ${FQDN} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **IP** | ${IP} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Webhook URL** | \`http://${FQDN}:8000/webhook\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Health** | http://${FQDN}:8000/health |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Note** | ACI exposes HTTP on port 8000 (no managed TLS). For production, front with Azure Application Gateway or a reverse proxy. |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Next Steps" >> "$GITHUB_STEP_SUMMARY"
            echo "1. Set the **Webhook URL** in your [GitHub App settings](https://github.com/settings/apps):" >> "$GITHUB_STEP_SUMMARY"
            echo "   \`http://${FQDN}:8000/webhook\`" >> "$GITHUB_STEP_SUMMARY"
            echo "2. Verify health: \`curl http://${FQDN}:8000/health\`" >> "$GITHUB_STEP_SUMMARY"
            echo "3. Open an issue to test!" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not determine FQDN. Check if the container instance exists."
          fi

      - name: Health check
        run: |
          set -euo pipefail
          FQDN=$(az container show \
            --name "${{ steps.app.outputs.name }}" \
            --resource-group "${{ steps.params.outputs.resource-group }}" \
            --query "ipAddress.fqdn" --output tsv 2>/dev/null || true)

          if [ -z "$FQDN" ]; then
            echo "::warning::Cannot health-check — FQDN not available"
            exit 0
          fi

          echo "Waiting for http://${FQDN}:8000/health ..."
          # ACI containers can take a couple minutes to start (image pull + volume mount + app startup).
          for i in $(seq 1 36); do
            HTTP_CODE=$(curl \
              -s \
              -o /dev/null \
              -w "%{http_code}" \
              --connect-timeout 3 \
              --max-time 5 \
              "http://${FQDN}:8000/health" \
              2>/dev/null || true)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed!"
              curl -s --connect-timeout 3 --max-time 5 "http://${FQDN}:8000/health" | python3 -m json.tool
              exit 0
            fi
            echo "  Attempt $i/36 — HTTP $HTTP_CODE (waiting 10s...)"
            sleep 10
          done

          echo "::error::Health check did not pass within the expected window. Dumping ACI diagnostics..."
          echo "" 
          echo "## container show" 
          timeout 30s az container show \
            --name "${{ steps.app.outputs.name }}" \
            --resource-group "${{ steps.params.outputs.resource-group }}" \
            -o jsonc \
            || true

          echo "" 
          echo "## container logs" 
          timeout 60s az container logs \
            --name "${{ steps.app.outputs.name }}" \
            --resource-group "${{ steps.params.outputs.resource-group }}" \
            --container-name "squadron" \
            || true

          exit 1

  # ════════════════════════════════════════════════════════════════════
  # Sync config only (no code changes — just upload config + restart)
  # ════════════════════════════════════════════════════════════════════
  sync-config:
    needs: [detect]
    if: >
      always() && (
        (github.event_name == 'workflow_dispatch' && inputs.action == 'sync-config')
        || (github.event_name == 'push' && needs.detect.outputs.code_changed != 'true')
      )
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Determine app name
        id: app
        run: |
          if [ -n "${{ inputs.app-name }}" ]; then
            echo "name=${{ inputs.app-name }}" >> "$GITHUB_OUTPUT"
          else
            REPO_NAME="${{ github.event.repository.name }}"
            echo "name=${REPO_NAME}-squadron" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve storage account
        id: storage
        run: |
          RG="${{ inputs.resource-group || 'squadron-rg' }}"
          STORAGE_ACCOUNT=$(az storage account list \
            --resource-group "$RG" \
            --query "[0].name" --output tsv)

          if [ -z "$STORAGE_ACCOUNT" ]; then
            echo "::warning::No storage account found in resource group '$RG'."
            echo "::warning::Run the workflow with action=deploy once to create infrastructure."
            exit 0
          fi

          STORAGE_KEY=$(az storage account keys list \
            --account-name "$STORAGE_ACCOUNT" \
            --query "[0].value" --output tsv)
          echo "account=$STORAGE_ACCOUNT" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$STORAGE_KEY"
          echo "key=$STORAGE_KEY" >> "$GITHUB_OUTPUT"

      - name: Sync .squadron/ config
        run: |
          az storage file delete-batch \
            --source "squadron-data" \
            --pattern ".squadron/*" \
            --account-name "${{ steps.storage.outputs.account }}" \
            --account-key "${{ steps.storage.outputs.key }}" \
            --output none \
            2>/dev/null || true

          az storage file upload-batch \
            --destination "squadron-data" \
            --source ".squadron" \
            --destination-path ".squadron" \
            --account-name "${{ steps.storage.outputs.account }}" \
            --account-key "${{ steps.storage.outputs.key }}"
          echo "Config synced"

      - name: Restart container to load new config
        run: |
          RG="${{ inputs.resource-group || 'squadron-rg' }}"
          APP="${{ steps.app.outputs.name }}"
          az container restart \
            --name "$APP" \
            --resource-group "$RG" \
            --output none
          echo "Container instance restarted with new config"

  # ════════════════════════════════════════════════════════════════════
  # Destroy all infrastructure
  # ════════════════════════════════════════════════════════════════════
  destroy:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Confirm destruction
        run: |
          echo "::warning::Destroying all Squadron resources in ${{ inputs.resource-group }}"
          echo "This will delete the Container Instance, storage, and all data."

      - name: Delete resource group
        run: |
          az group delete \
            --name "${{ inputs.resource-group || 'squadron-rg' }}" \
            --yes --no-wait
          echo "Resource group deletion initiated (async)"
          echo "## Squadron Destroyed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Resource group \`${{ inputs.resource-group || 'squadron-rg' }}\` is being deleted." >> "$GITHUB_STEP_SUMMARY"
